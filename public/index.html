<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>YouTube 双语字幕学习</title>
<style>
  :root {
    color-scheme: light dark;
    --bg: #f7f7f8;
    --card: #ffffff;
    --text: #1a1a1a;
    --muted: #6b7280;
    --accent: #2563eb;
    --accent-bg: #eaf1ff;
    --border: #e5e7eb;
  }
  @media (prefers-color-scheme: dark) {
    :root {
      --bg: #0f1115;
      --card: #181b21;
      --text: #f0f0f0;
      --muted: #9aa1ab;
      --accent: #5b9dff;
      --accent-bg: #1c2740;
      --border: #2a2e37;
    }
  }
  * { box-sizing: border-box; }
  body {
    margin: 0;
    min-height: 100vh;
    background: var(--bg);
    color: var(--text);
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", "PingFang SC", "Microsoft YaHei", sans-serif;
    padding: 24px 16px 48px;
  }
  .container { max-width: 720px; margin: 0 auto; }
  .card {
    background: var(--card);
    border: 1px solid var(--border);
    border-radius: 16px;
    padding: 28px 24px;
    box-shadow: 0 8px 30px rgba(0,0,0,0.06);
  }
  h1 { font-size: 1.35rem; margin: 0 0 6px; }
  p.sub { color: var(--muted); margin: 0 0 20px; font-size: 0.92rem; }
  .gen-row { display: flex; gap: 10px; }
  input[type="text"] {
    flex: 1;
    padding: 12px 14px;
    border-radius: 10px;
    border: 1px solid var(--border);
    background: transparent;
    color: var(--text);
    font-size: 0.95rem;
    min-width: 0;
  }
  button.primary {
    padding: 12px 18px;
    border: none;
    border-radius: 10px;
    background: var(--accent);
    color: white;
    font-size: 0.95rem;
    font-weight: 600;
    cursor: pointer;
    white-space: nowrap;
  }
  button.primary:disabled { opacity: 0.6; cursor: default; }
  #status { margin-top: 12px; font-size: 0.9rem; color: var(--muted); min-height: 1.2em; }
  #status.error { color: #dc2626; }

  /* 视频库 */
  .library { margin-top: 28px; }
  .library-head {
    display: flex;
    align-items: center;
    justify-content: space-between;
    gap: 12px;
    margin-bottom: 12px;
  }
  .library-head h2 { font-size: 1.05rem; margin: 0; }
  .library-head input {
    max-width: 220px;
    padding: 8px 12px;
    font-size: 0.88rem;
  }
  .channel-group { margin-bottom: 20px; }
  .channel-name {
    font-size: 0.85rem;
    font-weight: 600;
    color: var(--muted);
    margin: 0 0 8px 4px;
    text-transform: none;
  }
  .video-item {
    display: block;
    text-decoration: none;
    color: inherit;
    background: var(--card);
    border: 1px solid var(--border);
    border-radius: 12px;
    padding: 12px 14px;
    margin-bottom: 8px;
    transition: border-color 0.15s;
  }
  .video-item:hover { border-color: var(--accent); }
  .video-item .vtitle { font-weight: 600; font-size: 0.95rem; line-height: 1.4; }
  .video-item .meta {
    margin-top: 4px;
    font-size: 0.8rem;
    color: var(--muted);
    display: flex;
    gap: 12px;
    flex-wrap: wrap;
  }
  .badge {
    color: var(--accent);
    background: var(--accent-bg);
    border-radius: 4px;
    padding: 1px 6px;
  }
  .empty { color: var(--muted); font-size: 0.9rem; padding: 12px 4px; }
  /* 云端静态模式：隐藏生成入口，显示提示 */
  .static-note { display: none; color: var(--muted); font-size: 0.88rem; margin: 0; }
  body.static-mode .gen-row, body.static-mode #status { display: none; }
  body.static-mode .static-note { display: block; }
  body.static-mode p.sub { margin-bottom: 8px; }
</style>
</head>
<body>
  <div class="container">
    <div class="card">
      <h1>YouTube 双语字幕学习</h1>
      <p class="sub">粘贴一个 YouTube 链接，生成逐句中英对照 + 生词高亮的学习页面。</p>
      <div class="gen-row">
        <input id="url" type="text" placeholder="https://www.youtube.com/watch?v=..." autofocus />
        <button id="submit" class="primary">生成学习页</button>
      </div>
      <div id="status"></div>
      <p class="static-note">这是云端阅读版：随时随地打开学习。生成新视频请在电脑上操作，然后重新发布。</p>
    </div>

    <div class="library">
      <div class="library-head">
        <h2>我的视频库</h2>
        <input id="search" type="text" placeholder="搜索标题 / 博主…" />
      </div>
      <div id="library-list"><div class="empty">加载中…</div></div>
    </div>
  </div>
  <script src="index.js"></script>
</body>
</html>
