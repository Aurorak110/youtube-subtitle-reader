<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>单词本 · YouTube 双语字幕学习</title>
<style>
  :root {
    color-scheme: light dark;
    --bg: #f7f7f8;
    --card: #ffffff;
    --text: #1a1a1a;
    --muted: #6b7280;
    --accent: #2563eb;
    --accent-bg: #eaf1ff;
    --border: #e5e7eb;
    /* 词素类型配色 */
    --prefix: #7c3aed;
    --prefix-bg: #f0e9ff;
    --root: #dc2626;
    --root-bg: #ffe9e9;
    --suffix: #059669;
    --suffix-bg: #e3f7ef;
    --vowel: #9aa1ab;
    --vowel-bg: #eef0f3;
  }
  @media (prefers-color-scheme: dark) {
    :root {
      --bg: #0f1115;
      --card: #181b21;
      --text: #f0f0f0;
      --muted: #9aa1ab;
      --accent: #5b9dff;
      --accent-bg: #1c2740;
      --border: #2a2e37;
      --prefix: #c4b5fd; --prefix-bg: #2a2140;
      --root: #fca5a5; --root-bg: #3a1f1f;
      --suffix: #6ee7b7; --suffix-bg: #10362a;
      --vowel: #9aa1ab; --vowel-bg: #23262d;
    }
  }
  * { box-sizing: border-box; }
  body {
    margin: 0; min-height: 100vh;
    background: var(--bg); color: var(--text);
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", "PingFang SC", "Microsoft YaHei", sans-serif;
    padding: 24px 16px 48px;
  }
  .container { max-width: 760px; margin: 0 auto; }
  .topbar { display: flex; align-items: center; justify-content: space-between; gap: 12px; margin-bottom: 6px; }
  h1 { font-size: 1.35rem; margin: 0; }
  a.back { color: var(--accent); text-decoration: none; font-size: 0.9rem; white-space: nowrap; }
  a.back:hover { text-decoration: underline; }
  p.sub { color: var(--muted); margin: 4px 0 18px; font-size: 0.9rem; }

  .toolbar {
    display: flex; gap: 10px; flex-wrap: wrap; align-items: center;
    margin-bottom: 16px;
  }
  .toolbar input[type="text"] {
    flex: 1; min-width: 160px;
    padding: 10px 12px; border-radius: 10px;
    border: 1px solid var(--border); background: var(--card); color: var(--text);
    font-size: 0.92rem;
  }
  .chips { display: flex; gap: 6px; flex-wrap: wrap; }
  .chip {
    padding: 6px 12px; border-radius: 999px; cursor: pointer;
    border: 1px solid var(--border); background: var(--card); color: var(--muted);
    font-size: 0.82rem; user-select: none;
  }
  .chip.active { background: var(--accent-bg); color: var(--accent); border-color: var(--accent); }
  button.primary {
    padding: 10px 16px; border: none; border-radius: 10px;
    background: var(--accent); color: #fff; font-size: 0.9rem; font-weight: 600; cursor: pointer;
    white-space: nowrap;
  }
  button.primary:disabled { opacity: 0.6; cursor: default; }
  #analyze-status { font-size: 0.85rem; color: var(--muted); margin: -6px 0 14px; min-height: 1em; }
  #analyze-status.error { color: #dc2626; }

  .count-line { font-size: 0.85rem; color: var(--muted); margin-bottom: 12px; }

  .word {
    background: var(--card); border: 1px solid var(--border); border-radius: 14px;
    padding: 14px 16px; margin-bottom: 10px;
  }
  .word-head { display: flex; align-items: baseline; gap: 10px; flex-wrap: wrap; }
  .term { font-size: 1.12rem; font-weight: 700; letter-spacing: 0.2px; }
  .level {
    font-size: 0.72rem; color: var(--accent); background: var(--accent-bg);
    border-radius: 5px; padding: 1px 7px;
  }
  .freq { font-size: 0.75rem; color: var(--muted); margin-left: auto; }
  .zh { font-size: 0.92rem; color: var(--muted); margin-top: 3px; }

  /* 词根词缀拆解 */
  .morph { margin-top: 12px; padding-top: 12px; border-top: 1px dashed var(--border); }
  .pieces { display: flex; flex-wrap: wrap; gap: 8px; align-items: stretch; }
  .piece {
    display: flex; flex-direction: column; align-items: center;
    border-radius: 9px; padding: 5px 10px; min-width: 52px;
  }
  .piece .p-txt { font-weight: 700; font-size: 0.98rem; }
  .piece .p-mean { font-size: 0.74rem; margin-top: 1px; opacity: 0.85; }
  .piece .p-type { font-size: 0.64rem; margin-top: 2px; opacity: 0.7; }
  .p-prefix { color: var(--prefix); background: var(--prefix-bg); }
  .p-root   { color: var(--root);   background: var(--root-bg); }
  .p-suffix { color: var(--suffix); background: var(--suffix-bg); }
  .p-vowel  { color: var(--vowel);  background: var(--vowel-bg); }
  .plus { align-self: center; color: var(--muted); font-size: 0.9rem; }
  .literal { margin-top: 9px; font-size: 0.9rem; }
  .literal b { color: var(--accent); }
  .no-morph { margin-top: 8px; font-size: 0.8rem; color: var(--muted); font-style: italic; }

  .empty { color: var(--muted); font-size: 0.9rem; padding: 20px 4px; text-align: center; }

  /* 云端静态版：拆解按钮无后端，隐藏 */
  body.static-mode #analyze-btn, body.static-mode #analyze-status { display: none; }
</style>
</head>
<body>
  <div class="container">
    <div class="topbar">
      <h1>📒 单词本</h1>
      <a class="back" href="/">← 返回视频库</a>
    </div>
    <p class="sub">汇总所有视频里的生词，去重、按出现频次排序。医学词可一键拆成词根词缀，理解构词逻辑。</p>

    <div class="toolbar">
      <input id="search" type="text" placeholder="搜索单词 / 释义…" />
      <button id="analyze-btn" class="primary">生成词根拆解</button>
    </div>
    <div id="analyze-status"></div>

    <div class="chips" id="filters" style="margin-bottom:14px;">
      <span class="chip active" data-filter="all">全部</span>
      <span class="chip" data-filter="医学">医学</span>
      <span class="chip" data-filter="术语">术语</span>
      <span class="chip" data-filter="general">通用高级</span>
      <span class="chip" data-filter="hasMorph">已拆解</span>
    </div>

    <div class="count-line" id="count-line"></div>
    <div id="list"><div class="empty">加载中…</div></div>
  </div>
  <script src="wordbook.js"></script>
</body>
</html>
